<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dream.css">
    <title>Dreamcast Web</title>
    <link rel="icon" href="favicon.ico">

</head>
<body>

    <audio id="bootSound" src="BOOT.wav"></audio>

    <div id="boot">
        <div class="swirl"></div>
        <p class="boot-text">Dreamcast</p>
    </div>

    <script>
        if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
        window.location.href = "index.html";
        }
    </script>

    <script>
        window.addEventListener('load', () => {
        document.getElementById('bootSound').play();
        });
    </script>


    <script>
        setTimeout(() => {
        window.location.href = "menu.html"; 
        }, 3900); // match this to your animation length
    </script>

</body>
</html>
