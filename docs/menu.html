<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="menucss.css">
    <title>DreamcastWeb</title>
    <link rel="icon" href="favicon.ico">
</head>
<body>
    <audio id="clickSound" src="CONFIRMATION.wav" preload="auto"></audio>


    <script>
        if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
        window.location.href = "index.html";
        }
    </script>

    <script>
        function playClick() {
        const click = document.getElementById("clickSound");
        click.currentTime = 0; 
        click.play();
        }

        document.addEventListener("click", () => {
            playClick();
        });
    </script>


    <div class="top-bar">
        <img class="logo" src="logo.png" alt="Dreamcast">
        <span class="datetime">11/27/1998 00:00</span>
    </div>

        <a href="end.html" class="menu-icon">
            <img src="controller.png" alt="プレイ">
            <p>プレイ</p>
        </a>

        <a href="end.html" class="menu-icon">
            <img src="vmu.png" alt="ファイル">
            <p>ファイル</p>
        </a>

        <a href="end.html" class="menu-icon">
            <img src="music.gif" alt="サウンド">
            <p>サウンド</p>
        </a>

        <a href="end.html" class="menu-icon">
            <img src="clock.gif" alt="セット">
            <p>セット</p>
        </a>

    </div>

</body>
</html>
